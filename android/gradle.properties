org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# No proxy settings here on purpose. This file is tracked, so anything written
# into it also lands on the CI runners: systemProp.socksProxyHost=127.0.0.1 used
# to live here, which made every GitHub Android job tunnel the Gradle wrapper
# download into a SOCKS port that only exists on the dev machine, so it died with
# "Connection refused" before compiling a single line. A local proxy belongs in
# the untracked GRADLE_USER_HOME/gradle.properties instead.
