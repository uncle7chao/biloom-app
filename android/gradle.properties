org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Build-time proxy (BiLoom local mixed port, verified 2026-09-29)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
# Domestic mirrors stay direct; everything else goes through the proxy
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.cloud.tencent.com|mirrors.cloud.tencent.com
